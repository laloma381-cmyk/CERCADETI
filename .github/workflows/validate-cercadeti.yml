name: Validar Cerca de Ti
on:
  push:
    branches: [feature/monetizacion-cercadeti]
    paths:
      - "cerca-de-aqui/**"
      - ".github/workflows/validate-cercadeti.yml"
  pull_request:
    paths:
      - "cerca-de-aqui/**"
      - ".github/workflows/validate-cercadeti.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar JavaScript integrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("cerca-de-aqui/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          assert len(scripts) == 1, f"Se esperaba 1 módulo JS y se encontraron {len(scripts)}"
          Path("/tmp/cerca-de-ti.mjs").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/cerca-de-ti.mjs
      - name: Comprobar enlaces internos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href","")
                      if href and not href.startswith(("http://","https://","mailto:","tel:","#","javascript:")):
                          self.hrefs.append(href.split("#",1)[0].split("?",1)[0])
          root=Path("cerca-de-aqui")
          for page in root.glob("*.html"):
              p=Links(); p.feed(page.read_text(encoding="utf-8"))
              for href in p.hrefs:
                  if href and not (page.parent / href).exists():
                      raise SystemExit(f"Enlace roto: {page} -> {href}")
          print("Enlaces internos correctos")
          PY
