name: Validar Cerca de Ti · directorio de pago
on:
  push:
    branches: [feature/monetizacion-cercadeti]
    paths:
      - "cerca-de-aqui/**"
      - ".github/workflows/validate-cercadeti.yml"
  pull_request:
    paths:
      - "cerca-de-aqui/**"
      - ".github/workflows/validate-cercadeti.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar JavaScript integrado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("cerca-de-aqui/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          assert len(scripts) == 1, f"Se esperaba 1 módulo JS y se encontraron {len(scripts)}"
          Path("/tmp/cerca-de-ti.mjs").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/cerca-de-ti.mjs
      - name: Comprobar integración OpenStreetMap y Leaflet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("cerca-de-aqui/index.html").read_text(encoding="utf-8")
          checks = {
              "sin iframe de Google Maps": "google.com/maps" not in html and 'id="googleLocalMap"' not in html,
              "contenedor Leaflet presente": 'id="localMap"' in html,
              "CSS de Leaflet": "leaflet@1.9.4/dist/leaflet.css" in html,
              "JavaScript de Leaflet": "leaflet@1.9.4/dist/leaflet.js" in html,
              "tiles de OpenStreetMap": "tile.openstreetmap.org" in html,
              "mapa inicializado": "initMap();" in html,
              "centro por defecto de Pilar": "37.8657,-0.7906" in html,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERROR") + " - " + label)
          if not all(checks.values()):
              raise SystemExit("La integración del mapa no supera las comprobaciones.")
          PY
      - name: Comprobar aislamiento de datos y modelo de anuncios de pago
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("cerca-de-aqui/index.html").read_text(encoding="utf-8")
          sql = Path("cerca-de-aqui/supabase/migrations/20261127130000_cerca_paid_ads_inventory.sql").read_text(encoding="utf-8")
          checks = {
              "panel usa autorización propia Cerca": "rpc('cerca_is_admin')" in html,
              "panel no consulta profiles": "from('profiles')" not in html,
              "panel no consulta reports compartidos": "from('reports')" not in html,
              "solo planes de pago": "plan in ('basic','standard','featured')" in sql,
              "tarifas 4, 6 y 9 euros": "then 400" in sql and "then 600" in sql and "then 900" in sql,
              "no permite fichas gratis": "directory_free" not in sql and "not_required" not in sql,
              "requiere pago informado": "payment_report_not_pending" in sql and "payment_status='pending'" in sql,
              "publicación solo con pago verificado": "payment_status='verified'" in sql,
              "tabla de administradores aislada": "public.cerca_admins" not in sql and "cerca_private.is_admin()" in sql,
              "sin cambios de políticas de CAJUMAV": "alter table public.profiles" not in sql.lower() and "alter table public.reports" not in sql.lower(),
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERROR") + " - " + label)
          if not all(checks.values()):
              raise SystemExit("La migración o el aislamiento no superan las comprobaciones.")
          PY
      - name: Validar módulos del directorio y administración
        run: |
          node --check cerca-de-aqui/directory.js
          node --check cerca-de-aqui/admin.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path("cerca-de-aqui/index.html").read_text(encoding="utf-8")
          admin = Path("cerca-de-aqui/admin.js").read_text(encoding="utf-8")
          directory = Path("cerca-de-aqui/directory.js").read_text(encoding="utf-8")
          sql = Path("cerca-de-aqui/supabase/migrations/20261127150000_cerca_admin_catalogue_and_dashboard.sql").read_text(encoding="utf-8")
          checks = {
              "módulos JS enlazados": 'src="directory.js"' in html and 'src="admin.js"' in html,
              "tarjetas con foto y acciones rápidas": "business-photo" in directory and "wa.me/" in directory and "Cómo llegar" in directory,
              "búsqueda por categoría y texto": "categoryOK" in directory and "searchListings" in directory,
              "pines sincronizados con filtros": "updateMarkers(filtered)" in directory,
              "creación directa solo admin": "cerca_admin_create_listing" in admin and "cerca_private.is_admin()" in sql,
              "panel con estadísticas de usuarios": "cerca_admin_dashboard_stats" in admin and "registered_users" in sql,
              "aprobación y rechazo": "cerca_admin_review_listing" in admin,
              "edición, pausa, destacado y borrado": all(x in admin for x in ["cerca_admin_update_listing","cerca_admin_set_listing_status","cerca_admin_delete_listing"]),
              "almacenamiento de fotos protegido": "cerca-business-photos" in sql and "cerca_photo_admin_insert" in sql,
              "plan gratuito restringido a admin": "plan='admin' and price_cents=0 and created_by_admin=true" in sql,
          }
          for label, ok in checks.items():
              print(("OK" if ok else "ERROR") + " - " + label)
          if not all(checks.values()):
              raise SystemExit("La nueva arquitectura no supera las comprobaciones.")
          PY
      - name: Comprobar enlaces internos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href","")
                      if href and not href.startswith(("http://","https://","mailto:","tel:","#","javascript:")):
                          self.hrefs.append(href.split("#",1)[0].split("?",1)[0])
          root=Path("cerca-de-aqui")
          for page in root.glob("*.html"):
              p=Links(); p.feed(page.read_text(encoding="utf-8"))
              for href in p.hrefs:
                  if href and not (page.parent / href).exists():
                      raise SystemExit(f"Enlace roto: {page} -> {href}")
          print("Enlaces internos correctos")
          PY
